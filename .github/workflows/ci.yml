name: Phase 0 baseline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run lint
      - name: Baseline tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Test private staging evidence integrity manifest (synthetic files only)
        run: bun run test:staging-security
      - name: Validate fail-closed production configuration with synthetic values
        env:
          DEPLOYMENT_PREFLIGHT: '1'
          NODE_ENV: production
          APP_URL: https://staging.example.invalid
          APP_TRUSTED_PROXY_CIDRS: 127.0.0.1/32
          APP_REQUIRE_HTTPS: 'true'
          MFA_REQUIRE_PRIVILEGED: 'true'
          MFA_ENCRYPTION_KEY: 'a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90'
          DB_HOST: ci-mysql.example.invalid
          DB_PORT: '3306'
          DB_USER: ci_preflight
          DB_PASSWORD: CI_ONLY_PLACEHOLDER
          DB_NAME: aaditech_staging_ci
          DB_SSL: 'true'
        run: bun run deployment:preflight
      - name: Audit dependency advisories (non-gating, no auto-upgrades)
        if: always()
        run: |
          set +e
          bun audit --json > dependency-audit.json
          exit_code=$?
          echo "Dependency advisory audit exit status: $exit_code"
          exit 0
      - name: Generate machine-readable dependency risk triage
        run: node scripts/triage-dependencies.mjs dependency-audit.json dependency-triage.json
      - name: Block unreviewed new or escalated dependency advisories
        run: node scripts/check-dependency-baseline.mjs dependency-audit.json dependency-triage.json docs/security/dependency-advisory-baseline.json
      - name: Verify patched dependency versions and zero critical/high advisory matches
        run: node scripts/verify-patched-dependencies.mjs
      - name: Record held Phase 1Z release build provenance (no deployment)
        if: github.event_name == 'push' && github.ref == 'refs/heads/chore/phase0-foundation-20261106'
        env:
          RELEASE_CANDIDATE_CI: '1'
        run: bun run release:candidate
      - name: Upload held release candidate hash inventory
        if: github.event_name == 'push' && github.ref == 'refs/heads/chore/phase0-foundation-20261106'
        uses: actions/upload-artifact@v4
        with:
          name: held-phase1z-release-candidate
          path: release-candidate-manifest.json
          if-no-files-found: error
      - name: Upload dependency audit for human triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            dependency-audit.json
            dependency-triage.json
            dependency-baseline-status.json
          if-no-files-found: warn
      - name: Record architecture blockers (non-gating)
        if: always()
        run: node scripts/audit-baseline.mjs
      - name: Upload baseline audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-audit
          path: phase0-audit-report.json
          if-no-files-found: warn

  mysql-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: aaditech_ci
          MYSQL_ROOT_PASSWORD: ci_only_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_only_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci_only_password
      DB_NAME: aaditech_ci
      DB_SSL: 'false'
      CRM_TEST_DB: '1'
      MFA_ENCRYPTION_KEY: 'a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply non-destructive authentication migration
        run: bun run db:migrate:auth
      - name: Apply CRM migration
        run: bun run db:migrate:crm
      - name: Verify CRM migration rerun is idempotent
        run: bun run db:migrate:crm
      - name: Apply quotation draft migration
        run: bun run db:migrate:quotes
      - name: Verify quotation draft migration is idempotent
        run: bun run db:migrate:quotes
      - name: Apply quote idempotency migration
        run: bun run db:migrate:quote-idempotency
      - name: Verify quote idempotency migration rerun
        run: bun run db:migrate:quote-idempotency
      - name: Apply quote revisions migration
        run: bun run db:migrate:quote-revisions
      - name: Verify quote revisions migration rerun
        run: bun run db:migrate:quote-revisions
      - name: Apply quote review migration
        run: bun run db:migrate:quote-reviews
      - name: Verify quote review migration rerun
        run: bun run db:migrate:quote-reviews
      - name: Apply release hold migration
        run: bun run db:migrate:release-holds
      - name: Verify release hold migration rerun
        run: bun run db:migrate:release-holds
      - name: Apply reviewer role migration
        run: bun run db:migrate:reviewer-roles
      - name: Verify reviewer role migration rerun
        run: bun run db:migrate:reviewer-roles
      - name: Apply security event migration
        run: bun run db:migrate:security-events
      - name: Verify security event migration rerun
        run: bun run db:migrate:security-events
      - name: Apply durable login security migration
        run: bun run db:migrate:login-security
      - name: Verify login security migration rerun
        run: bun run db:migrate:login-security
      - name: Apply MFA migration
        run: bun run db:migrate:mfa
      - name: Verify MFA migration rerun
        run: bun run db:migrate:mfa
      - name: Apply MFA event audit migration
        run: bun run db:migrate:mfa-audit
      - name: Verify MFA audit migration rerun
        run: bun run db:migrate:mfa-audit
      - name: Apply MFA recovery migration
        run: bun run db:migrate:mfa-recovery
      - name: Verify MFA recovery migration rerun
        run: bun run db:migrate:mfa-recovery
      - name: Apply inventory opening-count migration (CI-only guard)
        run: bun run db:migrate:inventory
      - name: Verify inventory migration checksum and idempotent rerun
        run: bun run db:migrate:inventory
      - name: Apply procurement migration on disposable CI only
        run: bun run db:migrate:procurement
      - name: Verify procurement migration checksum and idempotent rerun
        run: bun run db:migrate:procurement
      - name: Apply quarantine intake migration on disposable CI only
        run: bun run db:migrate:intake
      - name: Verify quarantine intake migration checksum and idempotent rerun
        run: bun run db:migrate:intake
      - name: Apply internal supplier dispatch HOLD migration to disposable CI
        run: bun run db:migrate:dispatch-holds
      - name: Verify supplier dispatch HOLD migration checksum and rerun
        run: bun run db:migrate:dispatch-holds
      - name: Apply internal acknowledgment/GRN evidence migration on disposable CI
        run: bun run db:migrate:evidence-chain
      - name: Verify evidence chain migration checksum and idempotent rerun
        run: bun run db:migrate:evidence-chain
      - name: Apply hard-zero stock foundation schema on disposable CI
        run: bun run db:migrate:stock-foundation
      - name: Verify stock foundation schema checksum and idempotent rerun
        run: bun run db:migrate:stock-foundation
      - name: Apply unposted double-entry journal foundation schema on disposable CI
        run: bun run db:migrate:journal-foundation
      - name: Verify unposted journal migration checksum and idempotent rerun
        run: bun run db:migrate:journal-foundation
      - name: Apply untrusted signed-proof prerequisites to disposable CI
        run: bun run db:migrate:signed-proof
      - name: Verify signed proof migration checksum/idempotent rerun
        run: bun run db:migrate:signed-proof
      - name: Apply one-time possession and irrevocable key lifecycle schema on disposable CI
        run: bun run db:migrate:key-lifecycle
      - name: Verify key lifecycle migration idempotent checksum rerun
        run: bun run db:migrate:key-lifecycle
      - name: Apply external issuer/authority/revocation HELD prerequisites on disposable CI
        run: bun run db:migrate:external-trust
      - name: Verify external trust prerequisite migration checksum and idempotent rerun
        run: bun run db:migrate:external-trust
      - name: Apply preprovisioned pinned provider bridge migration on disposable CI
        run: bun run db:migrate:provider-bridge
      - name: Verify provider bridge migration checksum/idempotent rerun
        run: bun run db:migrate:provider-bridge
      - name: Run real MySQL integration tests
        run: bun run test:mysql
      - name: Verify owner-only inventory opening counts on disposable MySQL
        run: bun run test:inventory-mysql
      - name: Verify supplier attestation, independent purchase review and held PO
        run: bun run test:procurement-mysql
      - name: Verify immutable intake, independent quarantine witness and serial uniqueness
        run: bun run test:intake-mysql
      - name: Verify separated supplier destination and disabled dispatch outbox on MySQL
        run: bun run test:dispatch-mysql
      - name: Verify claimed supplier acknowledgment and GRN evidence HOLD on MySQL
        run: bun run test:evidence-chain-mysql
      - name: Verify zero-only stock gates, independent HELD release and nonallocating plans on MySQL
        run: bun run test:stock-foundation-mysql
      - name: Verify balanced, unposted journal proposals and unverified serial candidates on MySQL
        run: bun run test:journal-foundation-mysql
      - name: Verify Ed25519 self-registered key signatures and hard-denied supplier/warehouse trust
        run: bun run test:signed-proof-mysql
      - name: Verify one-time Ed25519 possession, expiry, rotation, emergency revocation, no external trust
        run: bun run test:key-lifecycle-mysql
      - name: Verify signed issuer/organization claims, monotonic revocations, freeze and no stock authority
        run: bun run test:external-trust-mysql
      - name: Verify configured root pins, signed organization credentials, feed rollback, freeze and no production trust
        run: bun run test:provider-bridge-mysql
      - name: Verify bounded authentication retention on disposable MySQL
        run: bun run test:retention-mysql
      - name: Retention report defaults to read-only dry run
        run: bun run auth:retention
      - name: Isolated HTTP authentication and MFA smoke
        run: bun run test:auth-smoke
      - name: Chromium browser MFA / role smoke (isolated CI only)
        env:
          BROWSER_E2E_CI: '1'
          BROWSER_E2E_BASE_URL: 'http://127.0.0.1:3000'
          BROWSER_E2E_CHROME_CHANNEL: 'chrome'
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          # ubuntu-24.04 GitHub runner provides Google Chrome; avoid flaky external apt mirrors.
          # Still run the real browser MFA/role smoke, never skip or mock it.
          command -v google-chrome
          google-chrome --version
          bun run dev > "$RUNNER_TEMP/aaditech-browser-server.log" 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Local CI app failed to start"
            tail -n 60 "$RUNNER_TEMP/aaditech-browser-server.log"
            exit 1
          fi
          node --import tsx scripts/browser-smoke.mjs
      - name: Read-only disposable staging readiness preflight
        env:
          STAGING_PREFLIGHT: '1'
        run: bun run staging:preflight
