name: Phase 1V one-time Bun lockfile refresh
on:
  push:
    branches:
      - chore/phase0-foundation-20261106
    paths:
      - package.json
      - .github/workflows/security-lock-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[phase1v-refresh]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - name: Resolve reviewed patched dependencies and regenerate Bun lockfile
        run: |
          bun install --ignore-scripts
          bun install --frozen-lockfile --ignore-scripts
          git diff -- bun.lock
      - name: Commit lockfile to development branch only
        run: |
          test "$GITHUB_REF" = "refs/heads/chore/phase0-foundation-20261106"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "chore(security): regenerate Bun lockfile for reviewed Phase 1V patches"
            git push origin HEAD:chore/phase0-foundation-20261106
          fi
